name: Destroy EC2 Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "DESTROY" para confirmar a destruicao da infraestrutura EC2:'
        required: true
        default: ''

concurrency:
  group: production-infra-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "ERRO: Confirmacao invalida. Digite exatamente 'DESTROY' para executar o destroy."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform Destroy
        working-directory: infra/terraform
        env:
          TF_VAR_existing_key_name: ${{ secrets.TF_VAR_EXISTING_KEY_NAME }}
          TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
          TF_VAR_ssh_allowed_cidr: ${{ secrets.TF_VAR_SSH_ALLOWED_CIDR }}
        run: |
          terraform destroy -auto-approve -input=false

      - name: Summary
        run: |
          echo "### 💥 Infraestrutura Destruida" >> $GITHUB_STEP_SUMMARY
          echo "Todos os recursos gerenciados pelo Terraform foram destruidos com sucesso." >> $GITHUB_STEP_SUMMARY
