name: Stop ECS Fargate Environment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "STOP" (ou "DESTROY") para confirmar a parada das tasks no ECS:'
        required: true
        default: ''

concurrency:
  group: production-infra-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  destroy:
    name: Stop ECS Tasks
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || secrets.ECS_CLUSTER || '' }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION || secrets.ECS_TASK_DEFINITION || '' }}
    steps:
      - name: Verify confirmation input
        run: |
          CONFIRM_UPPER=$(printf '%s' "${{ github.event.inputs.confirm }}" | tr '[:lower:]' '[:upper:]')
          if [ "${CONFIRM_UPPER}" != "STOP" ] && [ "${CONFIRM_UPPER}" != "DESTROY" ]; then
            echo "ERRO: Confirmacao invalida. Digite 'STOP' ou 'DESTROY' para parar as tasks do ECS."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop Running ECS Tasks
        id: stop_tasks
        run: |
          if [ -z "${ECS_CLUSTER}" ]; then
            echo "ERRO: Configure a GitHub Variable (ou Secret) ECS_CLUSTER."
            exit 1
          fi

          if [ -n "${ECS_TASK_DEFINITION}" ]; then
            TASK_FAMILY="${ECS_TASK_DEFINITION##*/}"
            TASK_FAMILY="${TASK_FAMILY%%:*}"
            TASK_ARNS=$(aws ecs list-tasks \
              --cluster "${ECS_CLUSTER}" \
              --family "${TASK_FAMILY}" \
              --desired-status RUNNING \
              --query 'taskArns[]' \
              --output text)
          else
            TASK_ARNS=$(aws ecs list-tasks \
              --cluster "${ECS_CLUSTER}" \
              --desired-status RUNNING \
              --query 'taskArns[]' \
              --output text)
          fi

          if [ -z "${TASK_ARNS}" ] || [ "${TASK_ARNS}" = "None" ]; then
            echo "Nenhuma task em execucao no cluster ${ECS_CLUSTER}."
            echo "stopped_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=0
          for TASK_ARN in ${TASK_ARNS}; do
            echo "Parando task ${TASK_ARN}..."
            aws ecs stop-task \
              --cluster "${ECS_CLUSTER}" \
              --task "${TASK_ARN}" \
              --reason "Stopped via GitHub Actions destroy workflow" >/dev/null
            COUNT=$((COUNT + 1))
          done

          echo "Aguardando ${COUNT} task(s) finalizar(em)..."
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks ${TASK_ARNS}
          echo "Todas as tasks foram paradas."
          echo "stopped_count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          echo "### 🛑 Ambiente ECS Fargate Parado" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** \`${{ env.ECS_CLUSTER }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tasks paradas:** ${{ steps.stop_tasks.outputs.stopped_count || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Recursos preservados (custo $0 ocioso):** Cluster ECS, Repositorio ECR e Task Definition." >> $GITHUB_STEP_SUMMARY
