[project]
name = "copiloto-suport"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "faker>=40.43.0",
    "fastapi>=0.142.2",
    "langchain>=1.4.6",
    "langchain-aws>=1.8.0",
    "langchain-core>=1.6.10",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "langsmith>=0.14.8",
    "poethepoet>=0.49.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.47",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload --port 8000"
test = "pytest"
setup-db = "python -m scripts.setup_db_permissions"
create-db = "python -m scripts.create_database"
seed-db = "python -m scripts.seed_database"
