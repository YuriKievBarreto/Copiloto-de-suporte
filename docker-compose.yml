services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts .sql desta pasta (ex.: schema.sql) rodam só na primeira
      # inicialização, quando o volume pgdata ainda está vazio.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helpdesk} -d ${POSTGRES_DB:-helpdesk}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest  # em projeto estável, fixe uma versão
    container_name: helpdesk-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"  # REST e dashboard (/dashboard)
      - "127.0.0.1:6334:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    # environment:
    #   QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

volumes:
  pgdata:
  qdrant_storage: