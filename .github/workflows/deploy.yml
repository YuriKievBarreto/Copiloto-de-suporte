name: Deploy ECS Fargate Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'db/**'
      - 'indexing/**'
      - 'rag_documents/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dockerfile'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: 'Fazer build e push de nova imagem no ECR antes de subir (desmarcado = start rapido com :latest)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-infra-deploy
  cancel-in-progress: false

permissions:
  contents: read

# NOTA DE CONTRATO: Os nomes dos jobs ("Run Unit Tests", "Deploy ECS Fargate") e dos steps abaixo
# ("Configure AWS credentials", "Validate ECS configuration", "Login to Amazon ECR",
# "Build & Push Image to ECR", "Stop Previous ECS Tasks", "Start ECS Fargate Task",
# "Wait for Task & Extract Public IP", "Update API Gateway Target", "External Smoke Test")
# sao mapeados e exibidos em tempo real na landing page de espera (frontend/deploy-status.js).
# Caso renomeie steps ou jobs, atualize o dicionario STEP_TO_PHASE em frontend/deploy-status.js.
jobs:
  test:
    name: Run Unit Tests
    if: ${{ github.event_name == 'push' || inputs.rebuild_image }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Pytest
        run: uv run pytest -q

  deploy:
    name: Deploy ECS Fargate
    needs: test
    if: ${{ always() && !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || secrets.ECR_REPOSITORY || '' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || secrets.ECS_CLUSTER || '' }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION || secrets.ECS_TASK_DEFINITION || '' }}
      ECS_SUBNETS: ${{ vars.ECS_SUBNETS || secrets.ECS_SUBNETS || '' }}
      ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP || secrets.ECS_SECURITY_GROUP || '' }}
      API_GATEWAY_ID: ${{ vars.API_GATEWAY_ID || secrets.API_GATEWAY_ID || '' }}
      API_GATEWAY_RESOURCE_ID: ${{ vars.API_GATEWAY_RESOURCE_ID || secrets.API_GATEWAY_RESOURCE_ID || '' }}
      SHOULD_BUILD: ${{ github.event_name == 'push' || inputs.rebuild_image }}
    steps:
      - name: Checkout repository
        if: ${{ github.event_name == 'push' || inputs.rebuild_image }}
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate ECS configuration
        run: |
          MISSING=()
          [ -z "${ECS_CLUSTER}" ] && MISSING+=("ECS_CLUSTER")
          [ -z "${ECS_TASK_DEFINITION}" ] && MISSING+=("ECS_TASK_DEFINITION")
          [ -z "${ECS_SUBNETS}" ] && MISSING+=("ECS_SUBNETS")
          [ -z "${ECS_SECURITY_GROUP}" ] && MISSING+=("ECS_SECURITY_GROUP")
          if [ "${SHOULD_BUILD}" = "true" ] && [ -z "${ECR_REPOSITORY}" ]; then
            MISSING+=("ECR_REPOSITORY")
          fi
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "ERRO: Configure as seguintes GitHub Variables (ou Secrets): ${MISSING[*]}"
            exit 1
          fi
          echo "Configuracao validada. Cluster=${ECS_CLUSTER}, TaskDef=${ECS_TASK_DEFINITION}, Build=${SHOULD_BUILD}"

      - name: Login to Amazon ECR
        id: login-ecr
        if: ${{ github.event_name == 'push' || inputs.rebuild_image }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Image to ECR
        if: ${{ github.event_name == 'push' || inputs.rebuild_image }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_SHA="${IMAGE_TAG:0:7}"
          IMAGE_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          IMAGE_SHA="${ECR_REGISTRY}/${ECR_REPOSITORY}:${SHORT_SHA}"
          echo "Compilando imagem a partir de dockerfile..."
          docker build -f dockerfile -t "${IMAGE_LATEST}" -t "${IMAGE_SHA}" .
          echo "Publicando tags no ECR (${IMAGE_LATEST} e ${IMAGE_SHA})..."
          docker push "${IMAGE_LATEST}"
          docker push "${IMAGE_SHA}"

      - name: Stop Previous ECS Tasks
        run: |
          TASK_FAMILY="${ECS_TASK_DEFINITION##*/}"
          TASK_FAMILY="${TASK_FAMILY%%:*}"
          RUNNING_TASKS=$(aws ecs list-tasks \
            --cluster "${ECS_CLUSTER}" \
            --family "${TASK_FAMILY}" \
            --desired-status RUNNING \
            --query 'taskArns[]' \
            --output text)

          if [ -n "${RUNNING_TASKS}" ] && [ "${RUNNING_TASKS}" != "None" ]; then
            echo "Parando tasks anteriores da familia ${TASK_FAMILY}..."
            for TASK_ARN in ${RUNNING_TASKS}; do
              echo "Parando task ${TASK_ARN}..."
              aws ecs stop-task \
                --cluster "${ECS_CLUSTER}" \
                --task "${TASK_ARN}" \
                --reason "Replaced by new GitHub Actions deploy" >/dev/null
            done
          else
            echo "Nenhuma task anterior em execucao."
          fi

      - name: Start ECS Fargate Task
        id: start_task
        run: |
          SUBNETS_CLEAN=$(printf '%s' "${ECS_SUBNETS}" | tr -d '[:space:]')
          SG_CLEAN=$(printf '%s' "${ECS_SECURITY_GROUP}" | tr -d '[:space:]')
          echo "Subindo task Fargate no cluster ${ECS_CLUSTER} usando ${ECS_TASK_DEFINITION}..."
          RUN_JSON=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${ECS_TASK_DEFINITION}" \
            --launch-type FARGATE \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS_CLEAN}],securityGroups=[${SG_CLEAN}],assignPublicIp=ENABLED}" \
            --output json)

          TASK_ARN=$(echo "${RUN_JSON}" | jq -r '.tasks[0].taskArn // empty')
          if [ -z "${TASK_ARN}" ]; then
            echo "ERRO: Falha ao iniciar task no ECS Fargate:"
            echo "${RUN_JSON}" | jq '.failures'
            exit 1
          fi
          echo "Task iniciada: ${TASK_ARN}"
          echo "task_arn=${TASK_ARN}" >> "$GITHUB_OUTPUT"

      - name: Wait for Task & Extract Public IP
        id: task_ip
        env:
          TASK_ARN: ${{ steps.start_task.outputs.task_arn }}
        run: |
          echo "Aguardando task ${TASK_ARN} entrar em estado RUNNING..."
          if ! aws ecs wait tasks-running --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}"; then
            echo "ERRO: Task nao atingiu estado RUNNING. Detalhes:"
            aws ecs describe-tasks \
              --cluster "${ECS_CLUSTER}" \
              --tasks "${TASK_ARN}" \
              --query 'tasks[0].{lastStatus:lastStatus,stoppedReason:stoppedReason,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
              --output json
            exit 1
          fi

          ENI_ID=$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" \
            --tasks "${TASK_ARN}" \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value | [0]' \
            --output text)

          if [ -z "${ENI_ID}" ] || [ "${ENI_ID}" = "None" ]; then
            echo "ERRO: Nao foi possivel obter a ENI da task ${TASK_ARN}."
            exit 1
          fi

          PUBLIC_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids "${ENI_ID}" \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text)

          if [ -z "${PUBLIC_IP}" ] || [ "${PUBLIC_IP}" = "None" ]; then
            echo "ERRO: Task sem IP publico associado na ENI ${ENI_ID}. Verifique se assignPublicIp=ENABLED e subnet publica estao configurados."
            exit 1
          fi

          echo "ENI: ${ENI_ID} | IP Publico: ${PUBLIC_IP}"
          echo "eni_id=${ENI_ID}" >> "$GITHUB_OUTPUT"
          echo "public_ip=${PUBLIC_IP}" >> "$GITHUB_OUTPUT"

      - name: Update API Gateway Target
        if: env.API_GATEWAY_ID != '' && env.API_GATEWAY_RESOURCE_ID != ''
        env:
          PUBLIC_IP: ${{ steps.task_ip.outputs.public_ip }}
        run: |
          echo "Atualizando REST API Gateway (${API_GATEWAY_ID}) com STREAM para http://${PUBLIC_IP}:8000/{proxy}..."
          aws apigateway put-integration \
            --rest-api-id "${API_GATEWAY_ID}" \
            --resource-id "${API_GATEWAY_RESOURCE_ID}" \
            --http-method ANY \
            --type HTTP_PROXY \
            --integration-http-method ANY \
            --uri "http://${PUBLIC_IP}:8000/{proxy}" \
            --response-transfer-mode STREAM \
            --timeout-in-millis 300000 \
            --request-parameters "{\"integration.request.path.proxy\":\"method.request.path.proxy\"}"

          echo "Disparando novo deployment para publicar mudanca..."
          aws apigateway create-deployment \
            --rest-api-id "${API_GATEWAY_ID}" \
            --stage-name prod

      - name: External Smoke Test
        env:
          PUBLIC_IP: ${{ steps.task_ip.outputs.public_ip }}
        run: |
          echo "Testando endpoint direto: http://${PUBLIC_IP}:8000/health"
          DIRECT_OK=0
          for i in $(seq 1 24); do
            if curl -fsS "http://${PUBLIC_IP}:8000/health"; then
              echo ""
              echo "Healthcheck direto bem-sucedido!"
              DIRECT_OK=1
              break
            fi
            echo "Aguardando resposta da API... (${i}/24)"
            sleep 5
          done

          if [ "${DIRECT_OK}" -ne 1 ]; then
            echo "ERRO: Endpoint direto http://${PUBLIC_IP}:8000/health nao respondeu em 120s."
            exit 1
          fi

          if [ -n "${API_GATEWAY_ID}" ]; then
            GATEWAY_URL="https://${API_GATEWAY_ID}.execute-api.${AWS_REGION}.amazonaws.com/prod/health"
            echo "Testando endpoint via API Gateway: ${GATEWAY_URL}"
            GW_OK=0
            for i in $(seq 1 12); do
              if curl -fsS "${GATEWAY_URL}"; then
                echo ""
                echo "Healthcheck via API Gateway bem-sucedido!"
                GW_OK=1
                break
              fi
              echo "Aguardando sincronizacao do API Gateway... (${i}/12)"
              sleep 5
            done

            if [ "${GW_OK}" -ne 1 ]; then
              echo "ERRO: Healthcheck via API Gateway (${GATEWAY_URL}) nao respondeu em 60s."
              exit 1
            fi
          fi

      - name: Summary
        if: always()
        run: |
          echo "### 🚀 Status do Deploy (ECS Fargate)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status do Job:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Modo:** ${{ env.SHOULD_BUILD == 'true' && 'Build + Push ECR + Run Task' || 'Start rapido (imagem :latest)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster ECS:** \`${{ env.ECS_CLUSTER }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Task ARN:** \`${{ steps.start_task.outputs.task_arn }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **IP Publico da Task:** \`${{ steps.task_ip.outputs.public_ip }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ env.API_GATEWAY_ID }}" ]; then
            GATEWAY_BASE="https://${{ env.API_GATEWAY_ID }}.execute-api.${{ env.AWS_REGION }}.amazonaws.com/prod"
            echo "- **API Gateway (HTTPS com Streaming):** [${GATEWAY_BASE}](${GATEWAY_BASE})" >> $GITHUB_STEP_SUMMARY
            echo "- **Healthcheck Gateway:** [${GATEWAY_BASE}/health](${GATEWAY_BASE}/health)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${{ steps.task_ip.outputs.public_ip }}" ]; then
            echo "- **Endpoint Direto Fargate:** [http://${{ steps.task_ip.outputs.public_ip }}:8000](http://${{ steps.task_ip.outputs.public_ip }}:8000)" >> $GITHUB_STEP_SUMMARY
            echo "- **Healthcheck Direto:** [http://${{ steps.task_ip.outputs.public_ip }}:8000/health](http://${{ steps.task_ip.outputs.public_ip }}:8000/health)" >> $GITHUB_STEP_SUMMARY
          fi
